<text x="32" y="575" font-size="17" fill="#526577" text-anchor="start" font-weight="400">操作示意图 · 并非实时网页截图 · 按钮以 GitHub 实际页面为准</text>
<rect x="58" y="181" width="308" height="115" rx="8" fill="#e8f7f0" stroke="none"/>
<text x="212" y="228" font-size="23" fill="#126346" text-anchor="middle" font-weight="700">Open</text>
<text x="212" y="269" font-size="22" fill="#126346" text-anchor="middle" font-weight="400">等待审核</text>
<rect x="386" y="181" width="308" height="115" rx="8" fill="#fff3d8" stroke="none"/>
<text x="540" y="228" font-size="23" fill="#805a00" text-anchor="middle" font-weight="700">Changes requested</text>
<text x="540" y="269" font-size="22" fill="#805a00" text-anchor="middle" font-weight="400">按意见修改</text>

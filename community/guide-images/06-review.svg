<text x="60" y="341" font-size="24" fill="#203747" text-anchor="start" font-weight="600">审核中：保持同一分支、同一文件夹、同名 JSON。</text>
<text x="60" y="384" font-size="22" fill="#526577" text-anchor="start" font-weight="400">不需要重新 Fork，也不用为补改再开一个 PR。</text>
<rect x="58" y="443" width="964" height="77" rx="8" fill="#e8f7f0" stroke="none"/>
<text x="78" y="472" font-size="21" fill="#126346" text-anchor="start" font-weight="700">已经 Merged，下一次更新才建立新分支、新 PR</text>
<text x="78" y="502" font-size="18" fill="#325849" text-anchor="start" font-weight="400">先同步自己副本的 main；作者署名由 README 和贡献者名单保留。</text>
